version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
  
  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - sqlserver

volumes:
  sqliweb-main_sqlserver_data:
